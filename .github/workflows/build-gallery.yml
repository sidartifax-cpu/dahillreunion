name: Build Gallery Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'images/gallery/**'
  workflow_dispatch:

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build gallery manifest
        run: |
          python3 << 'PYEOF'
          import os, json

          gallery_dir = 'images/gallery'
          extensions  = {'.jpg', '.jpeg', '.png', '.gif', '.webp'}
          images      = []

          if os.path.isdir(gallery_dir):
              for fname in sorted(os.listdir(gallery_dir)):
                  if fname.startswith('._'): continue
                  if fname.startswith('.'): continue
                  ext = os.path.splitext(fname)[1].lower()
                  if ext not in extensions: continue
                  images.append(fname)

          manifest = {"total": len(images), "images": images}

          with open('gallery-manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)

          print(f"Manifest built: {len(images)} real images found")
          PYEOF

      - name: Commit manifest
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add gallery-manifest.json
          if git diff --staged --quiet; then
            echo "No changes to manifest"
          else
            git commit -m "Auto-update gallery manifest [skip ci]"
            git push
          fi
